name: Deploy Project

on:
  push:
    branches:
      - main  # Trigger deployment when changes are pushed to the main branch
  pull_request:
    branches:
      - main  # Optionally, you can trigger deployment on PR merge

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_dev.txt

    - name: Run tests
      run: |
        pytest tests/  # This will run your test suite
      continue-on-error: false  # Ensure deployment doesn't run if tests fail

    - name: Deploy Application
      run: |
        echo "Deploying your application..."
        # Replace with your actual deployment steps (e.g., SSH, Docker, etc.)
